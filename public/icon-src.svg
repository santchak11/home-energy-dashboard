<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2d4a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunFill" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Sun ambient glow -->
  <circle cx="256" cy="195" r="175" fill="url(#sunGlow)"/>

  <!-- Sun rays (8 rays) -->
  <g transform="translate(256,195)" fill="#f59e0b" opacity="0.7">
    <rect x="-6" y="-155" width="12" height="40" rx="6"/>
    <rect x="-6" y="115" width="12" height="40" rx="6" />
    <rect x="-155" y="-6" width="40" height="12" rx="6"/>
    <rect x="115" y="-6" width="40" height="12" rx="6"/>
    <rect x="-6" y="-155" width="12" height="40" rx="6" transform="rotate(45)"/>
    <rect x="-6" y="115" width="12" height="40" rx="6" transform="rotate(45)"/>
    <rect x="-155" y="-6" width="40" height="12" rx="6" transform="rotate(45)"/>
    <rect x="115" y="-6" width="40" height="12" rx="6" transform="rotate(45)"/>
  </g>

  <!-- Sun circle with glow -->
  <circle cx="256" cy="195" r="88" fill="url(#sunFill)" filter="url(#glow)"/>
  <!-- Sun inner highlight -->
  <circle cx="240" cy="178" r="28" fill="white" fill-opacity="0.22"/>

  <!-- House body -->
  <rect x="163" y="316" width="186" height="120" rx="6" fill="#0f2040"/>
  <!-- Door -->
  <rect x="230" y="366" width="52" height="70" rx="26" fill="#080e1a"/>

  <!-- Roof -->
  <polygon points="148,322 256,228 364,322" fill="#fbbf24" filter="url(#softglow)"/>
  <!-- Roof underside (depth) -->
  <polygon points="148,322 256,228 364,322 364,332 256,238 148,332" fill="#b45309" opacity="0.5"/>

  <!-- Solar panels on roof (3 small panels) -->
  <g transform="rotate(-36, 256, 275)" opacity="0.9">
    <rect x="196" y="268" width="30" height="20" rx="3" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="231" y="268" width="30" height="20" rx="3" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="266" y="268" width="30" height="20" rx="3" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="211" y1="268" x2="211" y2="288" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="246" y1="268" x2="246" y2="288" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="281" y1="268" x2="281" y2="288" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Lightning bolt (energy symbol) bottom-right accent -->
  <g transform="translate(342, 360) scale(0.85)" fill="#fbbf24" opacity="0.85" filter="url(#softglow)">
    <path d="M22 2 L8 24 H18 L14 42 L30 18 H20 Z"/>
  </g>
</svg>
